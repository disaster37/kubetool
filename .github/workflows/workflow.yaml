name: "build"

on:
  push:
    branches:
      - main
      - v1.32
    tags:
      - "*"
  release:
    types: [published]
  pull_request:
    branches:
      - main
      - v1.32

jobs:
  build:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Call Dagger Function
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "0.21.8"
          verb: call
          args: --src . ci --ci --version ${{ github.ref_name }} --code-cove-token env:CODECOV_TOKEN --git-token env:GITHUB_TOKEN --registry-username env:REGISTRY_USERNAME --registry-password env:REGISTRY_PASSWORD --git-branch ${BRANCH_NAME} ${IS_TAG} ${IS_PR}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IS_TAG: ${{ github.ref_type == 'tag' && '--is-tag' || '' }}
          IS_PR: ${{ github.event_name == 'pull_request' && format('--pr-number={0}', github.event.pull_request.number) || '' }}
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_type == 'tag' && 'v1.32' || github.ref_name }}
